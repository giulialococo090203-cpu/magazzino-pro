issuer: Ariston SpA
keywords:
  - Ariston SpA
  - PRODOTTI E SERVIZI

fields:
  invoice_number:
    - "nr\\.\\s*(\\d+)"
  date:
    - "del\\s*(\\d{2}/\\d{2}/\\d{4})"
  lines:
    parser: lines
    start: "^NR\\s+DESCRIZIONE"
    end: "METODO DI PAGAMENTO|REGIME FISCALE|DATI AGGIUNTIVI|RIEPILOGO IVA|CALCOLO FATTURA"
    line: "^(\\d+)\\s+(.+?)\\s+(\\d+(?:[\\.,]\\d+)?)\\s+([A-Z]{1,5})\\s+(\\d+(?:[\\.,]\\d+)?)\\s+€\\s+(\\d+(?:[\\.,]\\d+)?)\\s+€"