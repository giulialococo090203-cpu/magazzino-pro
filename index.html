<!doctype html>
<html lang="it" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>WorkSpace - Sistema di Gestione</title>

    <!--
      Icona del sito.

      I browser tengono le icone in una memoria a parte, legata
      all'indirizzo del file: finche' l'indirizzo resta lo stesso
      continuano a mostrare quella vecchia anche dopo un nuovo
      caricamento. Per questo i file hanno nomi nuovi, con un numero
      di versione: e' l'unico modo perche' vengano davvero riletti.

      favicon.ico e apple-touch-icon.png stanno nella radice del sito
      con questi nomi esatti perche' Safari li cerca da solo per i
      preferiti e per l'elenco lettura, anche quando non sono
      dichiarati qui.
    -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icona-workspace-192.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icona-workspace-512.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />

    <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#232a27" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="WorkSpace — gestione del magazzino: giacenze, movimenti, fatture, riordini e controllo." />

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet" />
    <meta name="google" content="notranslate" />
  </head>
  <body>
    <div id="root" class="notranslate" translate="no"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
