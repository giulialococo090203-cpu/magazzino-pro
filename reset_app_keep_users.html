
<!doctype html>

<html lang="it">

  <head>

    <meta charset="UTF-8" />

    <title>Reset MagazzinoPro - Mantieni utenti</title>

    <style>

      body {

        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

        background: #111827;

        color: white;

        min-height: 100vh;

        display: grid;

        place-items: center;

        margin: 0;

      }

      .box {

        width: min(620px, 92vw);

        background: #1f2937;

        border: 1px solid rgba(255,255,255,.12);

        border-radius: 18px;

        padding: 28px;

        box-shadow: 0 24px 70px rgba(0,0,0,.35);

      }

      button {

        width: 100%;

        height: 48px;

        border: 0;

        border-radius: 12px;

        background: #ef4444;

        color: white;

        font-weight: 900;

        cursor: pointer;

        margin-top: 14px;

      }

      button.safe {

        background: #16a34a;

      }

      pre {

        background: #0b1220;

        padding: 14px;

        border-radius: 12px;

        overflow: auto;

        color: #d1d5db;

        max-height: 380px;

        white-space: pre-wrap;

        line-height: 1.45;

      }

    </style>

  </head>

  <body>

    <div class="box">

      <h1>Reset MagazzinoPro</h1>

      <p>

        Questo resetta l’app come nuova, ma mantiene utenti, login e dati auth.

        Verranno rimossi materiali, fatture, movimenti, prezzi, notifiche, proposte, storico e cache.

      </p>

      <button onclick="preview()">Controlla cosa verrà cancellato</button>

      <button class="safe" onclick="resetKeepUsers()">Svuota dati mantenendo utenti</button>

      <pre id="log">Pronto.</pre>

    </div>

    <script>

      const KEEP_PATTERNS = [

        'user',

        'users',

        'utente',

        'utenti',

        'auth',

        'login',

        'currentuser',

        'current_user',

        'session',

        'token',

        'role',

        'permission',

        'permissions'

      ];

      function shouldKeepKey(key) {

        const normalized = String(key || '').toLowerCase();

        return KEEP_PATTERNS.some((pattern) => normalized.includes(pattern));

      }

      function getPlan() {

        const localKeys = Object.keys(localStorage);

        const sessionKeys = Object.keys(sessionStorage);

        return {

          localKeep: localKeys.filter(shouldKeepKey),

          localDelete: localKeys.filter((key) => !shouldKeepKey(key)),

          sessionKeep: sessionKeys.filter(shouldKeepKey),

          sessionDelete: sessionKeys.filter((key) => !shouldKeepKey(key)),

        };

      }

      function backupBeforeReset() {

        const backup = {

          createdAt: new Date().toISOString(),

          localStorage: {},

          sessionStorage: {},

        };

        Object.keys(localStorage).forEach((key) => {

          backup.localStorage[key] = localStorage.getItem(key);

        });

        Object.keys(sessionStorage).forEach((key) => {

          backup.sessionStorage[key] = sessionStorage.getItem(key);

        });

        localStorage.setItem(

          'magazzino_backup_before_reset_' + Date.now(),

          JSON.stringify(backup)

        );

      }

      function formatList(title, items) {

        if (!items.length) return title + '\n  - Nessuna voce\n';

        return title + '\n' + items.map((item) => '  - ' + item).join('\n') + '\n';

      }

      function preview() {

        const log = document.getElementById('log');

        const plan = getPlan();

        log.textContent =

          formatList('✅ VERRANNO MANTENUTI:', [...plan.localKeep, ...plan.sessionKeep]) +

          '\n' +

          formatList('🗑️ VERRANNO CANCELLATI:', [...plan.localDelete, ...plan.sessionDelete]);

      }

      async function resetKeepUsers() {

        const log = document.getElementById('log');

        const plan = getPlan();

        const removed = [];

        try {

          backupBeforeReset();

          for (const key of plan.localDelete) {

            localStorage.removeItem(key);

            removed.push('localStorage: ' + key);

          }

          for (const key of plan.sessionDelete) {

            sessionStorage.removeItem(key);

            removed.push('sessionStorage: ' + key);

          }

          if ('caches' in window) {

            const cacheNames = await caches.keys();

            for (const name of cacheNames) {

              await caches.delete(name);

              removed.push('cache: ' + name);

            }

          }

          log.textContent =

            '✅ Reset completato.\n\n' +

            'Utenti, login e auth mantenuti.\n\n' +

            formatList('Cancellati:', removed) +

            '\nOra chiudi questa pagina, riapri MagazzinoPro e fai refresh.';

        } catch (err) {

          log.textContent = '❌ Errore reset: ' + err.message;

        }

      }

    </script>

  </body>

</html>
